[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-content-copilot"
version = "0.1.0.dev0"
description = "A local-first AI content and research copilot built with FastAPI and Ollama."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "beautifulsoup4",
    "pymupdf",
    "python-multipart",
]


[project.optional-dependencies]
dev = [
    "pytest",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"


[tool.setuptools.packages.find]
include = ["app*"]