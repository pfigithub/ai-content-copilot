[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-content-copilot"
version = "0.1.0.dev0"
description = "A local-first AI content and research copilot built with FastAPI and Ollama."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "beautifulsoup4",
    "pymupdf",
    "python-multipart",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "lingua-language-detector",
    "langcodes[data]",
    "langchain",
    "langchain-ollama",
    "langgraph",
    "langchain-text-splitters",
    "langchain-qdrant",
    "qdrant-client",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "duckduckgo-search>=6.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"


[tool.setuptools.packages.find]
include = ["app*"]